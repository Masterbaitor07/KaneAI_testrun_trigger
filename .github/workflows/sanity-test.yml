name: Run Sanity Tests on LambdaTest.

on:
  workflow_dispatch:

jobs:
  sanity-test:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Sanity Test on LambdaTest
        id: trigger-test
        run: |
          echo "Triggering sanity tests on LambdaTest"
          response=$(curl --location 'https://test-manager-api.lambdatest.com/api/atm/v1/hyperexecute' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Basic YW5zaHVscjpmTFRfVmFmZG1zZTY1Tm5BWHZWV2JSdVI2ZDBaOVE3eHFxMWU5QVVJMnFwYmdLOHZhbWI=' \
          --data '{
            "test_run_id": "01K90AXSSG9MJ076RG6RP9FZPN",
            "concurrency": 1,
            "title": "TR-Anshul"
          }')
          echo "Response: $response"
